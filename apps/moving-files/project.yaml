spec_version: "2.1"
app_id: com.runlevel.movingfiles
version: 0.2.0
support_arch:
  - amd64
  - arm64
product_series:
  - nasync
is_docker_app: false
only_admin: true
allow_add_access_path: true
start_cmd: bin/movingfiles_serv --port=21010
port: 21010
proxy_path: api
open_type: inner
supports:
  - app
  - pc
tag_types:
  - utility
  - backup
depend_fw_version: 1.13.0.0000
depend_docker_version: ""
license_agreement_link:
  - "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/docs/EULA.md"
  - "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/LICENSE"
source_code_link:
  - "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps"
  - "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/THIRD_PARTY_LICENSES.md"
technical_support_link:
  - "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/issues"
privacy_policy_link:
  - "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/docs/privacy/movingfiles.md"
parameters:
  - key: NAS_FOLDER
    type: path
    required: true
    changeable: true
    multi: true
    i18n:
      en-US:
        name: NAS folders (Volume 1)
        description: "Choose one or more folders on Volume 1 that Moving Files may read and write, for example the share where copies from a PC should land. You can change this later under App Center settings. Restart the app after any change so the folder picker and jobs see the new paths."
      de-DE:
        name: NAS-Ordner (Volume 1)
        description: "Einen oder mehrere Ordner auf Volume 1 wählen, die Moving Files lesen und schreiben darf, z. B. die Freigabe, in der Kopien vom PC landen. Später in den App-Center-Einstellungen änderbar. Nach jeder Änderung die App neu starten, damit Picker und Jobs die neuen Pfade sehen."
      zh-CN:
        name: NAS 文件夹（卷 1）
        description: "请选择卷 1 上 Moving Files 可以读写的一个或多个文件夹，例如电脑拷贝文件时使用的共享目录。之后可在应用中心的设置中随时更改授权路径。每次更改后请重启应用，以便文件夹选择器和任务能够看到新的路径。"
      fr-FR:
        name: Dossiers NAS (Volume 1)
        description: "Choisissez un ou plusieurs dossiers sur le Volume 1 que Moving Files peut lire et écrire, par ex. le partage où les copies depuis un PC doivent arriver. Modifiable plus tard dans les réglages App Center. Redémarrez l’app après chaque changement."
      es-ES:
        name: Carpetas NAS (Volumen 1)
        description: "Elija una o más carpetas en el Volumen 1 que Moving Files pueda leer y escribir, por ejemplo el recurso compartido donde deben llegar las copias del PC. Se puede cambiar después en Ajustes del App Center. Reinicie la app tras cada cambio."
      it-IT:
        name: Cartelle NAS (Volume 1)
        description: "Scegli una o più cartelle sul Volume 1 che Moving Files può leggere e scrivere, ad es. la condivisione dove devono arrivare le copie dal PC. Modificabile dopo in Impostazioni App Center. Riavvia l’app dopo ogni modifica."
      pl-PL:
        name: Foldery NAS (Wolumen 1)
        description: "Wybierz jeden lub więcej folderów na Wolumenie 1, które Moving Files może czytać i zapisywać, np. udział, na którym mają lądować kopie z PC. Później zmienialne w ustawieniach App Center. Po każdej zmianie uruchom aplikację ponownie."
      ru-RU:
        name: Папки NAS (Том 1)
        description: "Выберите одну или несколько папок на Томе 1, которые Moving Files может читать и писать, например общий ресурс, куда должны попадать копии с ПК. Позже можно изменить в настройках App Center. После каждого изменения перезапустите приложение."
      tr-TR:
        name: NAS klasörleri (Birim 1)
        description: "Moving Files’ın okuyup yazabileceği Birim 1 üzerindeki bir veya daha fazla klasör seçin, örn. PC’den kopyaların ineceği paylaşım. Sonra App Center ayarlarından değiştirilebilir. Her değişiklikten sonra uygulamayı yeniden başlatın."
      hr-HR:
        name: NAS mape (Volumen 1)
        description: "Odaberite jednu ili više mapa na Volumenu 1 koje Moving Files smije čitati i pisati, npr. dijeljenje gdje bi trebale stići kopije s PC-a. Kasnije se može promijeniti u postavkama App Centera. Nakon svake promjene ponovno pokrenite aplikaciju."
  - key: HDD_FOLDER
    type: path
    required: false
    changeable: true
    multi: true
    i18n:
      en-US:
        name: Volume 2 / HDD
        description: "Optional folders on Volume 2 (HDD) for a second copy or archive target. Add the HDD share here if you keep a second set of files on that volume. Leave empty if you only use Volume 1. Restart the app after any change so the folder picker lists the new paths."
      de-DE:
        name: Volume 2 / HDD
        description: "Optionale Ordner auf Volume 2 (HDD) für eine zweite Kopie oder als Archivziel. Hier die HDD-Freigabe eintragen, wenn Dateien auch auf diesem Volume liegen sollen. Leer lassen, wenn nur Volume 1 genutzt wird. Nach jeder Änderung die App neu starten."
      zh-CN:
        name: 卷 2 / HDD
        description: "可选：卷 2（HDD）上的文件夹，用于第二份拷贝或作为备份归档的目标。如果文件也要放在该卷上，请在此项中添加对应的共享目录。若只使用卷 1，此项可留空。每次更改后请重启应用，以便文件夹选择器显示新的路径。"
      fr-FR:
        name: Volume 2 / HDD
        description: "Dossiers optionnels sur le Volume 2 (HDD) pour une seconde copie ou une cible d’archive. Ajoutez le partage HDD si des fichiers doivent aussi y vivre. Laissez vide si vous n’utilisez que le Volume 1. Redémarrez l’app après tout changement."
      es-ES:
        name: Volumen 2 / HDD
        description: "Carpetas opcionales en el Volumen 2 (HDD) para una segunda copia o destino de archivo. Añada el recurso HDD si también guarda archivos ahí. Déjelo vacío si solo usa el Volumen 1. Reinicie la app tras cualquier cambio."
      it-IT:
        name: Volume 2 / HDD
        description: "Cartelle opzionali sul Volume 2 (HDD) per una seconda copia o destinazione archivio. Aggiungi la condivisione HDD se i file devono stare anche lì. Lascia vuoto se usi solo il Volume 1. Riavvia l’app dopo ogni modifica."
      pl-PL:
        name: Wolumen 2 / HDD
        description: "Opcjonalne foldery na Wolumenie 2 (HDD) na drugą kopię lub cel archiwum. Dodaj udział HDD, jeśli pliki mają też być na tym wolumenie. Zostaw puste, jeśli używasz tylko Wolumenu 1. Po zmianie uruchom aplikację ponownie."
      ru-RU:
        name: Том 2 / HDD
        description: "Необязательные папки на Томе 2 (HDD) для второй копии или цели архива. Добавьте HDD-ресурс, если файлы должны быть и там. Оставьте пустым, если используете только Том 1. После изменения перезапустите приложение."
      tr-TR:
        name: Birim 2 / HDD
        description: "İkinci kopya veya arşiv hedefi için Birim 2 (HDD) üzerinde isteğe bağlı klasörler. Dosyalar o birimde de olacaksa HDD paylaşımını ekleyin. Yalnızca Birim 1 kullanıyorsanız boş bırakın. Değişiklikten sonra uygulamayı yeniden başlatın."
      hr-HR:
        name: Volumen 2 / HDD
        description: "Opcionalne mape na Volumenu 2 (HDD) za drugu kopiju ili odredište arhive. Dodajte HDD dijeljenje ako datoteke trebaju biti i na tom volumenu. Ostavi prazno ako koristite samo Volumen 1. Nakon promjene ponovno pokrenite aplikaciju."
i18n:
  en-US:
    name: Moving Files
    description: "Moving Files copies and moves folders between this UGREEN NAS, Windows PCs and other NAS devices on your network using SMB. Run several independent jobs, wake a sleeping PC or NAS with Wake-on-LAN before a transfer, and create dated tar.gz backup archives with optional password protection. Restore extracts the original folder to a destination you choose. The UI supports German, English, Chinese, French, Spanish, Italian, Polish, Russian, Turkish and Croatian. You grant only the NAS folders it may use; Docker is not required."
    author: Runlevel
    official: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps"
    help: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/docs/help/movingfiles.md"
    publisher: Runlevel
    publisher_link: "https://github.com/runlevel1977-del"
  de-DE:
    name: Moving Files
    description: "Moving Files kopiert und verschiebt Ordner zwischen diesem UGREEN-NAS, Windows-PCs und anderen NAS-Geräten im Netzwerk per SMB. Mehrere Jobs laufen unabhängig. Schlafende PCs oder NAS werden bei Bedarf per Wake-on-LAN geweckt, bevor die Übertragung startet. Zusätzlich entstehen datierte tar.gz-Sicherungsarchive mit optionalem Passwort; Wiederherstellen legt den ursprünglichen Ordner am gewählten Ziel ab. Oberfläche u. a. Deutsch, Englisch, Chinesisch, Französisch, Spanisch, Italienisch, Polnisch, Russisch, Türkisch und Kroatisch. Freigegeben werden nur die NAS-Ordner, die du erlaubst; Docker ist nicht nötig."
    author: Runlevel
    official: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps"
    help: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/docs/help/movingfiles.md"
    publisher: Runlevel
    publisher_link: "https://github.com/runlevel1977-del"
  zh-CN:
    name: Moving Files
    description: "Moving Files 可在本台 UGREEN NAS、Windows 电脑以及其他 NAS 之间通过 SMB 复制或移动文件夹。支持同时运行多个互不干扰的任务，并在传输开始前通过网络唤醒（Wake-on-LAN）打开已休眠的电脑或 NAS。还可按日期生成 tar.gz 备份归档并可选密码保护；还原时会把原来的文件夹解压到你指定的目录。界面支持德语、英语、中文、法语、西班牙语、意大利语、波兰语、俄语、土耳其语和克罗地亚语。安装时只需授权真正需要访问的 NAS 文件夹，无需安装 Docker。"
    author: Runlevel
    official: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps"
    help: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/docs/help/movingfiles.md"
    publisher: Runlevel
    publisher_link: "https://github.com/runlevel1977-del"
  fr-FR:
    name: Moving Files
    description: "Moving Files copie et déplace des dossiers entre ce NAS UGREEN, des PC Windows et d’autres NAS du réseau via SMB. Plusieurs tâches indépendantes, réveil Wake-on-LAN si besoin, archives tar.gz datées avec mot de passe optionnel. L’interface est disponible en allemand, anglais, chinois, français, espagnol, italien, polonais, russe, turc et croate. Vous n’autorisez que les dossiers NAS nécessaires ; Docker n’est pas requis."
    author: Runlevel
    official: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps"
    help: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/docs/help/movingfiles.md"
    publisher: Runlevel
    publisher_link: "https://github.com/runlevel1977-del"
  es-ES:
    name: Moving Files
    description: "Moving Files copia y mueve carpetas entre este NAS UGREEN, PCs Windows y otros NAS de la red mediante SMB. Varias tareas independientes, Wake-on-LAN si hace falta, archivos tar.gz con fecha y contraseña opcional. La interfaz admite alemán, inglés, chino, francés, español, italiano, polaco, ruso, turco y croata. Solo concede las carpetas NAS necesarias; no se requiere Docker."
    author: Runlevel
    official: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps"
    help: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/docs/help/movingfiles.md"
    publisher: Runlevel
    publisher_link: "https://github.com/runlevel1977-del"
  it-IT:
    name: Moving Files
    description: "Moving Files copia e sposta cartelle tra questo NAS UGREEN, PC Windows e altri NAS in rete via SMB. Più job indipendenti, Wake-on-LAN se serve, archivi tar.gz datati con password opzionale. L’interfaccia supporta tedesco, inglese, cinese, francese, spagnolo, italiano, polacco, russo, turco e croato. Autorizzi solo le cartelle NAS necessarie; Docker non è richiesto."
    author: Runlevel
    official: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps"
    help: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/docs/help/movingfiles.md"
    publisher: Runlevel
    publisher_link: "https://github.com/runlevel1977-del"
  pl-PL:
    name: Moving Files
    description: "Moving Files kopiuje i przenosi foldery między tym NAS UGREEN, komputerami Windows i innymi NAS w sieci przez SMB. Wiele niezależnych zadań, Wake-on-LAN w razie potrzeby, datowane archiwa tar.gz z opcjonalnym hasłem. Interfejs obsługuje niemiecki, angielski, chiński, francuski, hiszpański, włoski, polski, rosyjski, turecki i chorwacki. Udostępniasz tylko potrzebne foldery NAS; Docker nie jest wymagany."
    author: Runlevel
    official: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps"
    help: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/docs/help/movingfiles.md"
    publisher: Runlevel
    publisher_link: "https://github.com/runlevel1977-del"
  ru-RU:
    name: Moving Files
    description: "Moving Files копирует и перемещает папки между этим UGREEN NAS, ПК Windows и другими NAS в сети по SMB. Несколько независимых заданий, Wake-on-LAN при необходимости, датированные архивы tar.gz с опциональным паролем. Интерфейс поддерживает немецкий, английский, китайский, французский, испанский, итальянский, польский, русский, турецкий и хорватский. Вы даёте доступ только к нужным папкам NAS; Docker не требуется."
    author: Runlevel
    official: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps"
    help: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/docs/help/movingfiles.md"
    publisher: Runlevel
    publisher_link: "https://github.com/runlevel1977-del"
  tr-TR:
    name: Moving Files
    description: "Moving Files, bu UGREEN NAS, Windows bilgisayarlar ve ağdaki diğer NAS’lar arasında SMB ile klasör kopyalar ve taşır. Birden fazla bağımsız iş, gerekirse Wake-on-LAN, isteğe bağlı parolalı tarihli tar.gz arşivleri. Arayüz Almanca, İngilizce, Çince, Fransızca, İspanyolca, İtalyanca, Lehçe, Rusça, Türkçe ve Hırvatçayı destekler. Yalnızca gereken NAS klasörlerini yetkilendirirsiniz; Docker gerekmez."
    author: Runlevel
    official: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps"
    help: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/docs/help/movingfiles.md"
    publisher: Runlevel
    publisher_link: "https://github.com/runlevel1977-del"
  hr-HR:
    name: Moving Files
    description: "Moving Files kopira i premješta mape između ovog UGREEN NAS-a, Windows računala i drugih NAS uređaja u mreži putem SMB-a. Više neovisnih poslova, Wake-on-LAN po potrebi, datirani tar.gz arhivi s opcionalnom lozinkom. Sučelje podržava njemački, engleski, kineski, francuski, španjolski, talijanski, poljski, ruski, turski i hrvatski. Dopuštate samo potrebne NAS mape; Docker nije potreban."
    author: Runlevel
    official: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps"
    help: "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/docs/help/movingfiles.md"
    publisher: Runlevel
    publisher_link: "https://github.com/runlevel1977-del"
