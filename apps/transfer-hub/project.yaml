spec_version: "2.1"
app_id: com.runlevel.transferhub
version: 0.6.35
support_arch:
  - amd64
  - arm64
is_docker_app: true
only_admin: true
port: 29100
open_type: tab
supports:
  - app
  - pc
tag_types:
  - utility
  - devtool
depend_fw_version: 1.13.0.0000
depend_docker_version: 1.7.0.0000
license_agreement_link:
  - "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/docs/EULA.md"
  - "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/LICENSE"
source_code_link:
  - "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps"
  - "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/THIRD_PARTY_LICENSES.md"
technical_support_link:
  - "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/issues"
privacy_policy_link:
  - "https://github.com/runlevel1977-del/Runlevel-UGOS-Apps/blob/main/docs/privacy/transferhub.md"


parameters:
  - key: NAS_DATA_ROOT
    type: path
    required: true
    changeable: true
    i18n:
      en-US:
        name: UGOS folder
        description: "Only this folder is mounted for copy/sync (not the whole NAS). Pick the target folder, e.g. a backup share. Restart after change."
      de-DE:
        name: UGOS-Ordner
        description: "Nur dieser Ordner wird für Kopieren/Sync gemountet (nicht das ganze NAS). Zielordner wählen, z. B. SICHERN. Danach App neu starten."
      zh-CN:
        name: UGOS 文件夹
        description: "仅挂载您选择的文件夹用于复制/同步（不会挂载整个 NAS）。请选择目标文件夹，例如备份共享。更改后请重启应用。"
      fr-FR:
        name: Dossier UGOS
        description: "Seul ce dossier est monté pour la copie/sync (pas tout le NAS). Choisissez le dossier cible, p. ex. une sauvegarde. Redémarrez après modification."
      es-ES:
        name: Carpeta UGOS
        description: "Solo se monta esta carpeta para copiar/sincronizar (no todo el NAS). Elija la carpeta de destino, p. ej. una copia de seguridad. Reinicie tras el cambio."
      it-IT:
        name: Cartella UGOS
        description: "Solo questa cartella viene montata per copia/sync (non tutto il NAS). Scegliere la cartella di destinazione, es. un backup. Riavviare dopo la modifica."
      pl-PL:
        name: Folder UGOS
        description: "Tylko ten folder jest montowany do kopiowania/synchronizacji (nie cały NAS). Wybierz folder docelowy, np. udział kopii. Po zmianie zrestartuj aplikację."
      ru-RU:
        name: Папка UGOS
        description: "Для копирования/синхронизации монтируется только эта папка (не весь NAS). Выберите целевую папку, например резервную. После изменения перезапустите приложение."
      tr-TR:
        name: UGOS klasörü
        description: "Kopyalama/senkron için yalnızca bu klasör bağlanır (tüm NAS değil). Hedef klasörü seçin, örn. yedek paylaşımı. Değişiklikten sonra uygulamayı yeniden başlatın."
      hr-HR:
        name: UGOS mapa
        description: "Za kopiranje/sinkronizaciju montira se samo ova mapa (ne cijeli NAS). Odaberite odredišnu mapu, npr. sigurnosnu dijeljenje. Nakon promjene ponovno pokrenite aplikaciju."
  - key: LAN_SUBNET
    type: string
    required: false
    changeable: true
    i18n:
      en-US:
        name: Home network (scan)
        description: "Optional CIDR for LAN device scan, e.g. 192.168.2.0/24 (restart app after change)"
      de-DE:
        name: Heimnetz (Scan)
        description: "Optional, Netz für Gerätesuche, z. B. 192.168.2.0/24 (nach Änderung App neu starten)"
      zh-CN:
        name: 局域网网段
        description: "可选扫描网段，例如 192.168.2.0/24（更改后请重启应用）"
      fr-FR:
        name: Réseau domestique (scan)
        description: "CIDR optionnel pour le scan LAN, p. ex. 192.168.2.0/24 (redémarrer l’app après modification)"
      es-ES:
        name: Red doméstica (escaneo)
        description: "CIDR opcional para el escaneo LAN, p. ej. 192.168.2.0/24 (reinicie la app tras el cambio)"
      it-IT:
        name: Rete domestica (scan)
        description: "CIDR opzionale per la scansione LAN, es. 192.168.2.0/24 (riavviare l’app dopo la modifica)"
      pl-PL:
        name: Sieć domowa (skan)
        description: "Opcjonalny CIDR do skanowania LAN, np. 192.168.2.0/24 (po zmianie zrestartuj aplikację)"
      ru-RU:
        name: Домашняя сеть (скан)
        description: "Необязательный CIDR для сканирования LAN, напр. 192.168.2.0/24 (после изменения перезапустите приложение)"
      tr-TR:
        name: Ev ağı (tarama)
        description: "LAN taraması için isteğe bağlı CIDR, örn. 192.168.2.0/24 (değişiklikten sonra uygulamayı yeniden başlatın)"
      hr-HR:
        name: Kućna mreža (sken)
        description: "Opcionalni CIDR za LAN skeniranje, npr. 192.168.2.0/24 (nakon promjene ponovno pokrenite aplikaciju)"
  - key: SCAN_EXTRA_HOSTS
    type: string
    required: false
    changeable: true
    i18n:
      en-US:
        name: Extra hosts (scan)
        description: "Optional comma-separated IPs always probed, e.g. 192.168.2.200"
      de-DE:
        name: Zusatz-IPs (Scan)
        description: "Optional, kommagetrennt, z. B. 192.168.2.200"
      zh-CN:
        name: 额外主机
        description: "可选额外扫描地址，逗号分隔，例如 192.168.2.200"
      fr-FR:
        name: Hôtes supplémentaires (scan)
        description: "IPs optionnelles, séparées par des virgules, toujours sondées, p. ex. 192.168.2.200"
      es-ES:
        name: Hosts extra (escaneo)
        description: "IPs opcionales separadas por comas, siempre sondeadas, p. ej. 192.168.2.200"
      it-IT:
        name: Host extra (scan)
        description: "IP opzionali separati da virgola, sempre sondati, es. 192.168.2.200"
      pl-PL:
        name: Dodatkowe hosty (skan)
        description: "Opcjonalne IP rozdzielone przecinkami, zawsze sprawdzane, np. 192.168.2.200"
      ru-RU:
        name: Доп. хосты (скан)
        description: "Необязательные IP через запятую, всегда проверяются, напр. 192.168.2.200"
      tr-TR:
        name: Ek hostlar (tarama)
        description: "İsteğe bağlı, virgülle ayrılmış ve her zaman yoklanan IP’ler, örn. 192.168.2.200"
      hr-HR:
        name: Dodatni hostovi (sken)
        description: "Opcionalne IP adrese odvojene zarezom, uvijek se provjeravaju, npr. 192.168.2.200"
