      en-US:
        name: Data directory
        description: "Vault registry and logs (e.g. /volume1/docker/lock-and-key/data)"
      de-DE:
        name: Datenverzeichnis
        description: "Tresor-Metadaten und Logs (z. B. /volume1/docker/lock-and-key/data)"
      zh-CN:
        name: 数据目录
        description: "应用数据目录，例如 /volume1/docker/<app>/data"
