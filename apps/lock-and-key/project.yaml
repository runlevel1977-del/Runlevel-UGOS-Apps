        name: Répertoire de données
        description: "Registre des coffres et journaux (ex. /volume1/docker/lock-and-key/data)"
      es-ES:
        name: Directorio de datos
        description: "Registro de cajas fuertes y registros (p. ej. /volume1/docker/lock-and-key/data)"
      it-IT:
        name: Directory dati
        description: "Registro caveau e log (es. /volume1/docker/lock-and-key/data)"
      pl-PL:
        name: Katalog danych
        description: "Rejestr sejfów i logi (np. /volume1/docker/lock-and-key/data)"
      ru-RU:
        name: Каталог данных
        description: "Реестр хранилищ и журналы (напр. /volume1/docker/lock-and-key/data)"
