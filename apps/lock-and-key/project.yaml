        name: Veri dizini
        description: "Kasa kaydı ve günlükler (örn. /volume1/docker/lock-and-key/data)"
      hr-HR:
        name: Direktorij podataka
        description: "Registar sefova i zapisnici (npr. /volume1/docker/lock-and-key/data)"
  - key: NAS_DATA_ROOT
    type: path
    required: true
    changeable: true
    i18n:
      en-US:
        name: UGOS folder shortcut
        description: "Subfolder for folder picker (Volume 1/2 separate in app)"
      de-DE:
        name: UGOS-Ordner
        description: "Kurzweg für Ordnerauswahl (Volume 1/2 in der App)"
      zh-CN:
        name: UGOS 文件夹
        description: "供应用访问的用户指定文件夹快捷方式"
      fr-FR:
        name: Raccourci dossier UGOS
        description: "Sous-dossier pour le sélecteur (Volume 1/2 séparés dans l’app)"
      es-ES:
        name: Acceso carpeta UGOS
        description: "Subcarpeta para el selector (Volumen 1/2 aparte en la app)"
      it-IT:
        name: Collegamento cartella UGOS
        description: "Sottocartella per il selettore (Volume 1/2 separati nell’app)"
      pl-PL:
        name: Skrót folderu UGOS
        description: "Podfolder do wyboru (Wolumen 1/2 osobno w aplikacji)"
      ru-RU:
        name: Ярлык папки UGOS
        description: "Подпапка для выбора (Том 1/2 отдельно в приложении)"
      tr-TR:
        name: UGOS klasör kısayolu
        description: "Seçici için alt klasör (Birim 1/2 uygulamada ayrı)"
      hr-HR:
        name: UGOS prečac mape
        description: "Podmapa za odabir (Volumen 1/2 odvojeno u aplikaciji)"
